# Tool defaults — the bottom config layer.
#
#   configs/defaults.yaml     THIS FILE. Generic tool defaults. Committed.
#                             Improves as the tool learns across videos.
#   projects/<name>.yaml      which project we're building for. Gitignored.
#   videos/<slug>/config.yaml which video. Generated fresh by stage 00.
#
# Every tunable in the pipeline lives in one of those three files — never as a
# literal in Python (DEC-014). Each key documents what moving it trades away,
# because these files are the tuning surface for someone who did not write the
# code.
#
# NOTHING PROJECT-SPECIFIC BELONGS IN THIS FILE. Knowledge about a consuming
# application lives in projects/<name>.yaml (DEC-017), and CI fails the build if
# a project name appears anywhere in src/ or here.
#
# Defaults are starting points chosen for phone-of-monitor footage of a laptop
# screen. Expect per-video divergence; that is the design working.

sample:
  # Frames per second. Scene detection is deliberately not offered — handheld
  # footage has constant micro-motion so hard cuts barely register (DEC-003).
  # Raise for videos with fast navigation; costs linear time and disk.
  fps: 1.0
  # JPEG quality, 1 (best) to 31. Below ~5 starts eating small label detail.
  quality: 3
  # Time ranges to skip entirely: [["0:00", "0:12"]]. Use for intros, desk
  # shots, and any span where the screen is not visible at all.
  skip_ranges: []
  # Safety cap. If hit, a warning is written to the manifest and surfaced —
  # never a silent truncation.
  max_frames: 2000

rectify:
  # Output size for the warped screen. Fixed so that band_rect and ocr regions
  # below can be expressed in stable pixel coordinates.
  canonical_size: [1600, 1000]
  # Median window (frames) for smoothing detected corners. Higher = steadier but
  # slower to follow genuine reframing. Must be odd.
  smooth_window: 9
  # Below this, detection is treated as weak and interpolated from neighbours
  # rather than trusted. Lower it only if `interpolated` dominates the manifest.
  min_quad_confidence: 0.55
  # Plausible width/height ratio for the screen. Rejects contours that are
  # clearly not a laptop display (a window, a desk edge, a reflection).
  #
  # Measure before narrowing this. A 16:9 screen does NOT read as 1.78 in
  # handheld footage: the detected bright region excludes the dark bezel and
  # taskbar, and perspective compresses it vertically, so ~1.95-2.15 is normal.
  # Too tight a bound reports "screen-not-found" for frames the detector
  # actually resolved at good confidence.
  aspect_bounds: [1.3, 2.2]
  # How far the screen may move between consecutive samples, as a fraction of
  # the frame diagonal. A detection that lands further away found something
  # else — a reflection, a second monitor — and rectifying it would produce a
  # confident crop of the wrong thing. Raise it for footage shot while walking;
  # lower it if reflections are being accepted as screens.
  max_jump_fraction: 0.10
  # How many consecutive over-budget detections must agree on a new position
  # before the detector re-acquires there. This is what separates a camera that
  # was genuinely re-aimed from a reflection wandering across the frame: the
  # re-aimed camera settles, the reflection does not.
  #
  # Lower = recovers faster after a reposition, but is easier to fool into
  # locking onto a bright object that happens to sit still. Raise it if the
  # manifest shows re-anchors onto things that are not the screen. The frames
  # in the run are kept once it fires, so raising this costs coverage.
  reanchor_after_frames: 3
  # Manual override for spans where detection fails. Corners are clockwise from
  # top-left, in source-frame pixels:
  #   - {from: "4:10", to: "6:30", corners: [[210,88],[1720,120],[1700,980],[190,940]]}
  manual_corners: []

clean:
  # Sub-pixel alignment against the previous frame. Cancels jitter that survived
  # rectification.
  align: true
  # Local contrast normalisation. Screen brightness is uneven when photographed
  # at an angle, so global normalisation makes one side worse.
  clahe: {enabled: true, clip: 2.0, grid: 8}
  # Glare suppression, bounded. A blown-out highlight has no recoverable detail;
  # max_correction keeps the stage from inventing pixels where there are none.
  deglare: {enabled: true, max_correction: 0.3}
  # Moiré reduction. Off by default — it costs fine detail. Enable per video
  # only if the interference pattern is measurably harming OCR.
  moire: {enabled: false, sigma: 0.6}

dedupe:
  # The title + tab band in canonical coordinates: [x, y, w, h]. This region is
  # what identifies a screen, and is the primary dedupe signal (DEC-007).
  # Re-measure per video if the app chrome sits at a different height.
  band_rect: [0, 0, 1600, 190]
  # Perceptual hash distance above which a frame counts as a new screen.
  # Lower = more screens kept. Tune this first when the screen count is wrong.
  hash_distance: 12
  # Weight of the full-frame comparison as a secondary signal. Catches dialogs
  # opening and scroll position changing within one screen. Raise it if distinct
  # states are collapsing; lower it if one screen fragments into many.
  full_frame_weight: 0.3
  # Minimum frames between two keeps. Suppresses flicker during transitions.
  min_gap_frames: 2

ocr:
  engine: tesseract
  # Which bands to read. Chrome only — data grids are never OCR'd (DEC-011).
  # Drop a region from this list if it reads as noise on a particular video; its
  # rectangle below stays, so re-enabling it needs no re-measuring.
  #
  # `activity` is deliberately NOT enabled by default. It sits below the tab strip,
  # which on a grid-heavy screen is where the column headers or the first data row
  # begin — and a default that quietly OCR'd a data row would break DEC-011 by
  # accident. Measure it against a real rectified frame, then add it here.
  regions: [title, tabs]
  # Where those bands are, as [x, y, w, h] in CANONICAL coordinates — the same
  # coordinate space as dedupe.band_rect, so all of these must be re-measured
  # together whenever rectify.canonical_size changes.
  #
  # These are starting guesses for a desktop application with a title bar above a
  # workspace tab strip. Measure them once per application from a frame in
  # frames/rect/. Generous vertical padding costs nothing (tesseract is handed a
  # single line to read); a rectangle that clips the text costs the whole read.
  region_rects:
    # Left portion only. A title is left-aligned, while the right end of the bar
    # usually holds the logged-in user, environment or clock — none of which
    # identifies a screen and all of which adds words to the cross-check.
    title: [0, 0, 720, 72]
    tabs: [0, 72, 1600, 64]        # the workspace tab strip beneath the title
    activity: [0, 136, 1600, 56]   # sub-header between the tabs and the content
  # Words below this confidence are recorded but not used as a matching signal.
  min_word_confidence: 0.4
  # Tesseract page segmentation mode. 7 = "single text line", correct for bands.
  psm: 7

identify:
  # Title-band strips per montage sheet. Higher = fewer model calls but smaller
  # strips; if the model starts misreading, lower this before blaming the prompt.
  montage_rows: 20
  # Which vendor's model reads the montages. Both are held to the same schema in
  # model/schema.py, so the pipeline's output shape does not change with this —
  # but the reading itself will, and confidence is calibrated against a model's
  # habits. Treat a change here as a tuning round: re-run `reframe verify` and
  # expect the review list to move. The response cache is keyed by provider AND
  # model, so switching cannot replay the other one's answers.
  provider: openai
  # Model id, as that provider names it. Must accept images and structured
  # output; the whole stage is reading small text off a photographed screen, so
  # prefer the strongest vision model available over the cheapest.
  #
  # Confirm this against the account before a tuning round — model ids move, and
  # a stale one fails the run at the first montage rather than silently.
  #
  # Chosen over gpt-4o on evidence, not on being newer: shown the same strip of
  # an occluded toolbar, gpt-4o reported tabs ['Orders', 'Medications'] where the
  # pixels contain 'Orders' and a lookup grid — one real tab and one invented,
  # indistinguishable downstream. This model abstained and said why. Weigh that
  # above cost here: a fabricated tab is the failure this tool exists to prevent.
  model: gpt-5.2
  # Bump whenever the prompt in model/prompts.py changes, or the response cache
  # will silently serve stale results and make a tuning round meaningless.
  prompt_version: 3
  # Read every screen as a whole frame rather than as a strip on a contact sheet.
  #
  # A montage strip is the top band only, so anything the screen puts elsewhere is
  # invisible — a left navigation list in particular, whose selected row is what
  # distinguishes two views that share a heading. Where that is how the application
  # is organised, strips cannot tell those views apart and the catalogue collapses
  # them into one.
  #
  # Costs roughly one model call per screen instead of one per montage_rows
  # screens. Leave it off for applications whose heading alone identifies a screen;
  # turn it on when the manifest shows `section` never being filled and screens
  # that should be distinct sharing a name.
  full_frames: false
  # Read a second, different frame of every screen and compare the two names.
  # This is the cross_frame confidence signal's only source of repeat sightings:
  # matching them by band hash does not work on handheld footage (DEC-025).
  #
  # Roughly doubles the model calls for this stage. Turning it off does not
  # lower confidence scores dishonestly — the signal is reported unmeasurable
  # and drops out of the average — but with it off, most screens have too few
  # measured signals to be accepted at all.
  corroborate: true

confidence:
  # Below this, a screen is escalated to NEEDS_REVIEW.md rather than accepted.
  # Expect to lower it as the pipeline earns trust across videos — never raise
  # it to make the review list shorter.
  accept_threshold: 0.75
  # Signals are independent measurements, not the model's self-report (DEC-009).
  # A signal with no weight here takes no part at all — which is how
  # `inventory_match` stays opt-in: it is the only one that describes the
  # consuming project rather than the footage. Add `inventory_match: 0.2` to let
  # stage 07 feed it back.
  #
  # A signal that cannot be measured is dropped and the remaining weights are
  # renormalised, never scored zero (DEC-022). `cross_frame` is unmeasurable
  # unless a screen was seen twice with identical pixels, so expect coverage to
  # rest on three signals in practice.
  weights:
    ocr_agreement: 0.3    # model's name vs the OCR'd title string
    cross_frame: 0.3      # do repeat sightings get the same name
    framing: 0.2          # did stage 02 flag this span
    legibility: 0.2       # ink separation and blur over the title band. NOT glare:
                          # a saturated-pixel count cannot tell a blown-out
                          # highlight from a light UI theme (DEC-022). These two
                          # constants are fitted to synthetic footage — re-check
                          # them on the first real video.

classify:
  # Normalised similarity required for a fuzzy inventory match. Below this the
  # screen is `new` WITH a possible_match note — never silently unbuilt.
  fuzzy_threshold: 0.82
  # How close to fuzzy_threshold a rejected match must come before a human is
  # asked to look at it. The closest candidate is ALWAYS recorded in the manifest
  # and in BUILD_QUEUE.md; this only governs what reaches NEEDS_REVIEW.md.
  # Raise it to see more possible collisions; lower it if the review list fills
  # with unrelated names. At 0 every new screen drags its most-similar entry into
  # the list, which is how a review list becomes something people skim.
  near_miss_margin: 0.15

  # Per-VIDEO name corrections, applied before fuzzy matching. This is where a
  # validation round lands when THIS video's footage quality causes a consistent
  # misread. Corrections that are properties of the app rather than the footage
  # belong in projects/<name>.yaml instead.
  #   "Bed Ctrl": "Bed Board"
  aliases: {}

# NOTE: `inventory`, `classify.modules_in_scope` and project-wide aliases are
# deliberately absent — they are project knowledge and live in
# projects/<name>.yaml. See projects/_example.yaml and DEC-017.
